<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Campus Explorer</h1>
    <input type="text" id="search" placeholder="Search clubs or events...">
    <div id="filters">
      <button data-category="all" class="active">All</button>
      <button data-category="technical">Technical</button>
      <button data-category="others">Others</button>
      <button data-category="cultural">Cultural</button>
      <button data-category="sports">Sports</button>
    </div>
    <p id="count"></p>
  </header>

  <main id="cards"></main>
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
